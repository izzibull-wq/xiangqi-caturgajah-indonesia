*{

}

html,body,#root{
  margin:0;
  min-height:100%
}

body{
  font-family:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased
}

.font-chinese{
  font-family:"Noto Serif SC", "Songti SC", serif
}

.font-serif{
  font-family:"Playfair Display", Georgia, serif;
  letter-spacing:-.01em
}

button{
  cursor:pointer
}

.eyebrow{
  font-size:11px;
  letter-spacing:.18em;
  font-weight:700;
  text-transform:uppercase;
  color:var(--muted)
}

.card-pro{
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--surface);
  box-shadow:0 1px 2px rgba(43,33,24,.05), 0 8px 24px rgba(43,33,24,.05)
}

.btn-primary{
  background:var(--ink);
  color:#fff;
  border-radius:10px;
  font-weight:600
}

.btn-primary:hover{
  filter:brightness(1.12)
}

.btn-accent{
  background:var(--red);
  color:#fff;
  border-radius:10px;
  font-weight:600
}

.btn-accent:hover{
  filter:brightness(1.08)
}

.btn-ghost{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
  font-weight:600;
  color:var(--ink)
}

.section-label{
  font-size:11px;
  letter-spacing:.16em;
  font-weight:700;
  text-transform:uppercase;
  color:var(--muted)
}

/* Papan utama: dikecilkan ~12% agar pas dalam satu layar. Lebar kartu dibatasi
   sekaligus oleh tinggi viewport, dengan margin seimbang di sekeliling papan. */

.game-board-card{
  width:100%;
  max-width:620px;
  margin-inline:auto
}

.game-board-card--wide{
  max-width:660px
}

@media (min-width:640px) and (max-width:1023px){
  .game-board-card{
    max-width:85vw
  }

  .game-board-card--wide{
    max-width:90vw
  }
}

@media (max-width:639px){
  .game-board-card{
    max-width:98vw
  }
}

.puzzle-board-card{
  width:100%;
  max-width:600px;
  margin-inline:auto
}

@media (min-width:640px) and (max-width:1023px){
  .puzzle-board-card{
    max-width:85vw
  }
}

@media (max-width:639px){
  .puzzle-board-card{
    max-width:98vw
  }
}

/* GEOMETRI BIDAK — anti-menumpuk: slot tiap titik = tepat 1 sel
   (12.5% lebar papan). Diameter bidak = 80% jarak antar titik,
   jadi antar tepi bidak tetangga tersisa ~20% sel sebagai celah.
   Contoh: sel 64px -> bidak 51px; sel 56px -> bidak 45px. */

.board-grid{
  container-type:inline-size
}

.piece-slot{
  display:grid;
  place-items:center
}

.big-piece{
  width:80%;
  aspect-ratio:1/1;
  height:auto;
  font-weight:900;
  font-size:clamp(16px,2.4vw,26px);
  /* Font +/-52% diameter bidak (maks. 60%): 5.2cqw dari lebar papan. */
  font-size:5.2cqw;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  /* Sorotan tidak boleh mengubah ukuran: ring/bayangan saja, tanpa scale. */
  transform:none !important;
}

@media (min-width:1024px){
  .game-shell .game-board-card{
    max-width:min(100%,600px,calc((100dvh - 200px)*8/9));
    min-width:min(100%,470px)
  }

  .game-shell .game-center{
    scrollbar-width:thin
  }
}

@keyframes confetti-fall{
  0%{
    transform:translateY(-10px) rotate(0deg);
    opacity:1
  }

  100%{
    transform:translateY(340px) rotate(540deg);
    opacity:.2
  }
}

.confetti-piece{
  position:absolute;
  top:-8px;
  width:10px;
  height:16px;
  border-radius:2px;
  animation:confetti-fall 2.6s ease-in infinite
}

@keyframes pulse-soft{
  0%,100%{
    transform:scale(1)
  }

  50%{
    transform:scale(1.06)
  }
}

  animation:pulse-soft 1.6s ease-in-out infinite
